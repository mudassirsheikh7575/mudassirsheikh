<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mudassir Sheikh, AI-native designer</title>
  <meta name="description" content="Mudassir Sheikh designs and builds websites and digital products from Pakistan." />
  <meta name="theme-color" content="#0a0a0b" />
  <meta property="og:title" content="Mudassir Sheikh, AI-native designer" />
  <meta property="og:image" content="assets/portrait.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="is-loading">
  <!-- Loader -->
  <div id="loader" aria-hidden="true">
    <svg class="mark mark--loader" viewBox="0 0 64 40"><use href="#logo" /></svg>
    <span class="loader__count" id="loader-count">000</span>
  </div>

  <!-- Logo symbol: an original monogram, an "M" whose last stroke turns into an "S" -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 64 40">
      <path fill="currentColor" d="M0 40V0h9l11 18L31 0h9v40h-9V17l-8 13h-6L9 17v23z" />
      <path fill="currentColor" d="M64 6.5 59.5 13c-3-2.3-6-3.6-8.6-3.6-2.3 0-3.6.9-3.6 2.3 0 1.6 1.4 2.3 5.6 3.5 6.1 1.7 9.6 4.2 9.6 10.1 0 6.9-5.3 11-12.6 11-1.8 0-3.6-.3-5.3-.8v-9.4c1.9 1.2 4.1 2 6 2 2.5 0 3.8-.9 3.8-2.4 0-1.7-1.4-2.4-5.8-3.7-5.8-1.7-9.3-4.1-9.3-9.8C39.3 4.3 44.2 0 51.3 0 56.1 0 60.5 2 64 6.5z" />
    </symbol>
  </svg>

  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="#" id="home" aria-label="Mudassir Sheikh, home">
      <svg class="mark" viewBox="0 0 64 40"><use href="#logo" /></svg>
    </a>
    <div class="top__meta top__meta--a">
      <span class="label">Currently:</span>
      <span id="t-role"></span>
    </div>
    <div class="top__meta top__meta--b">
      <span class="label">Based in:</span>
      <span><span id="t-city"></span> (<time id="clock">--:--</time>)</span>
    </div>
    <nav class="top__nav" aria-label="Main">
      <span class="label">Navigation:</span>
      <span class="nav-links">
        <button data-open="selected">Selected</button>, <button data-open="work">Work</button>, <button data-open="about">About</button>, <button data-open="contact">Contact</button>
      </span>
    </nav>
    <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="mnav">Menu</button>
  </header>

  <div class="mnav" id="mnav" hidden>
    <button data-open="selected">Selected</button>
    <button data-open="work">Work</button>
    <button data-open="about">About</button>
    <button data-open="contact">Contact</button>
    <div class="mnav__foot"><span id="m-city"></span> · <time id="m-clock"></time></div>
  </div>

  <!-- Hero overlay -->
  <section class="hero" id="hero">
    <p class="hero__intro reveal" id="intro"></p>
    <button class="pill reveal" id="explore">Explore the work <span class="pill__icon" aria-hidden="true">↓</span></button>
    <div class="hero__social reveal">
      <span class="label">Elsewhere:</span>
      <span id="social"></span>
    </div>
    <h1 class="bigname" id="bigname"></h1>
  </section>

  <!-- Flight HUD -->
  <div class="hud" id="hud" aria-live="polite">
    <button class="hud__now" id="now">
      <span class="hud__i" id="now-i">001</span>
      <span class="hud__t"><span id="now-t"></span><span class="hud__s" id="now-s"></span></span>
    </button>
    <div class="hud__right">
      <span class="hud__seen" id="seen"></span>
      <button class="pill pill--light" id="back"><span aria-hidden="true">↺</span> Back to home</button>
    </div>
  </div>
  <p class="hint" id="hint">Scroll, drag or use ↑ ↓ to fly</p>

  <!-- Side panel -->
  <aside class="box" id="box" aria-hidden="true" role="dialog" aria-labelledby="box-h">
    <div class="box__bar">
      <button class="pill pill--ghost" id="close"><span aria-hidden="true">‹</span> Close</button>
      <span class="box__tag" id="box-tag"></span>
    </div>
    <div class="box__scroll" id="box-body"></div>
  </aside>

  <noscript><p class="noscript">This portfolio needs JavaScript for its 3D view. Email <a href="mailto:hello@mudassirsheikh.com">hello@mudassirsheikh.com</a>.</p></noscript>

  <script src="content.js"></script>
  <script src="portrait-data.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
  <script src="sound.js"></script>
</body>
</html>
